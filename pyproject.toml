[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rfblock"
version = "2.0.0"
description = "RF Chain Block Diagram Editor & scikit-rf Physics Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RFBlock Team" }
]

dependencies = [
    "scikit-rf>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyinstaller>=6.5.0",
    "pywebview>=5.0.0",
]

[project.scripts]
rfblock = "rfblock.cli:main_app"
rfblock-build = "rfblock.cli:main_build"

[tool.hatch.build.targets.wheel]
packages = ["python/rfblock"]

[dependency-groups]
dev = []
